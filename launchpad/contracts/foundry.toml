[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/vectors" }]
ffi = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
